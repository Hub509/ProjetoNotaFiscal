<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Usuário</h1>
        <p class="subtitle">Crie uma nova conta de acesso</p>

        <form action="php/insert_usuario.php" method="post">
            <div class="form-group">
                <label for="nome_usuario">Nome Completo</label>
                <input type="text" id="nome_usuario" name="nome_usuario" required>
            </div>

            <div class="form-group">
                <label for="email_usuario">E-mail</label>
                <input type="email" id="email_usuario" name="email_usuario" required>
            </div>

            <div class="form-group">
                <label for="cpf_usuario">CPF</label>
                <input type="text" id="cpf_usuario" name="cpf_usuario" placeholder="000.000.000-00" required>
            </div>

            <div class="form-group">
                <label for="senha_usuario">Senha</label>
                <input type="password" id="senha_usuario" name="senha_usuario" required>
            </div>

            <div class="form-group">
                <label for="confirmar_senha">Confirmar Senha</label>
                <input type="password" id="confirmar_senha" name="confirmar_senha" required>
            </div>

            <button type="submit" class="btn">Cadastrar Usuário</button>
        </form>

        <div class="links-footer">
            <a href="login.html">Voltar para o Login</a> | 
            <a href="home.html">Ir para Home</a>
        </div>
    </div>
</body>
</html>
