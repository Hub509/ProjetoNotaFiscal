<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Gestão</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Acesso ao Sistema</h1>
        <p class="subtitle">Insira suas credenciais para continuar</p>

        <form action="home.html" method="post">
            <div class="form-group">
                <label for="email_login">E-mail</label>
                <input type="email" id="email_login" name="email_login" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="form-group">
                <label for="senha_login">Senha</label>
                <input type="password" id="senha_login" name="senha_login" placeholder="Digite sua senha" required>
            </div>

            <!-- Botão submit e link direto caso o navegador bloqueie POST em arquivo local -->
            <button type="submit" class="btn">Entrar</button>
            <a href="home.html" class="btn btn-secondary">Entrar (Navegação Direta)</a>
        </form>

        <div class="links-footer">
            <p>Não possui conta? <a href="cadastro_usuario.html">Cadastre-se aqui</a></p>
        </div>
    </div>
</body>
</html>
