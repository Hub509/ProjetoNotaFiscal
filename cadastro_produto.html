<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Produto</h1>
        <p class="subtitle">Adicione um novo item ao catálogo</p>

        <form action="php/insert_produto.php" method="post">
            <div class="form-group">
                <label for="codigo_produto">Código / SKU</label>
                <input type="text" id="codigo_produto" name="codigo_produto" required>
            </div>

            <div class="form-group">
                <label for="nome_produto">Nome do Produto</label>
                <input type="text" id="nome_produto" name="nome_produto" required>
            </div>

            <div class="form-group">
                <label for="descricao_produto">Descrição</label>
                <input type="text" id="descricao_produto" name="descricao_produto">
            </div>

            <div class="form-group">
                <label for="preco_produto">Preço Unitário (R$)</label>
                <input type="number" step="0.01" id="preco_produto" name="preco_produto" required>
            </div>

            <div class="form-group">
                <label for="estoque_produto">Quantidade em Estoque</label>
                <input type="number" id="estoque_produto" name="estoque_produto" required>
            </div>

            <button type="submit" class="btn">Salvar Produto</button>
            <a href="home.html" class="btn btn-secondary">Voltar para Home</a>
        </form>
    </div>
</body>
</html>
