<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Cliente</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Cliente</h1>
        <p class="subtitle">Preencha os dados do cliente</p>

        <form action="php/insert_cliente.php" method="post">
            <div class="form-group">
                <label for="nome_cliente">Nome / Razão Social</label>
                <input type="text" id="nome_cliente" name="nome_cliente" required>
            </div>

            <div class="form-group">
                <label for="documento_cliente">CPF / CNPJ</label>
                <input type="text" id="documento_cliente" name="documento_cliente" required>
            </div>

            <div class="form-group">
                <label for="telefone_cliente">Telefone</label>
                <input type="tel" id="telefone_cliente" name="telefone_cliente" placeholder="(00) 00000-0000">
            </div>

            <div class="form-group">
                <label for="email_cliente">E-mail</label>
                <input type="email" id="email_cliente" name="email_cliente">
            </div>

            <div class="form-group">
                <label for="endereco_cliente">Endereço Completo</label>
                <input type="text" id="endereco_cliente" name="endereco_cliente">
            </div>

            <button type="submit" class="btn">Salvar Cliente</button>
            <a href="home.html" class="btn btn-secondary">Voltar para Home</a>
        </form>
    </div>
</body>
</html>
