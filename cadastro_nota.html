<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Nota</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Nota</h1>
        <p class="subtitle">Registro de emissão de nota fiscal</p>

        <form action="#" method="post">
            <div class="form-group">
                <label for="numero_nota">Número da Nota</label>
                <input type="text" id="numero_nota" name="numero_nota" required>
            </div>

            <div class="form-group">
                <label for="serie_nota">Série</label>
                <input type="text" id="serie_nota" name="serie_nota" required>
            </div>

            <div class="form-group">
                <label for="data_emissao">Data de Emissão</label>
                <input type="date" id="data_emissao" name="data_emissao" required>
            </div>

            <div class="form-group">
                <label for="cliente_nota">ID ou Nome do Cliente</label>
                <input type="text" id="cliente_nota" name="cliente_nota" required>
            </div>

            <div class="form-group">
                <label for="valor_total_nota">Valor Total (R$)</label>
                <input type="number" step="0.01" id="valor_total_nota" name="valor_total_nota" required>
            </div>

            <button type="submit" class="btn">Salvar Nota</button>
            <a href="cadastro_item_nota.html" class="btn">Adicionar Itens na Nota</a>
            <a href="home.html" class="btn btn-secondary">Voltar para Home</a>
        </form>
    </div>
</body>
</html>
